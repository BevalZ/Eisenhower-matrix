[package]
name = "eisenhower-matrix"
version = "3.3.1"
description = "Eisenhower Matrix desktop task manager with AI-powered quadrant classification"
edition = "2021"

[lib]
name = "eisenhower_matrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "=2.6.0"
tauri-plugin-dialog = "=2.8.0"
# Without platform features keyring uses an in-memory mock and secrets vanish on restart.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
