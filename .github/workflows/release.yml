name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust_target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            rust_target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Eisenhower Matrix ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **手机端界面重排**：工具栏移到屏幕下方，上方留白避开状态栏与下拉手势；点击象限空白处即可新建任务（去掉快速输入框，新建一律走 AI 向导，象限由 AI 判断，仍可在结尾微调）
            - **WebDAV 同步 AI 配置**：AI 服务、接口地址、模型与 API Key 可随任务一起同步（设置 → WebDAV 里可开关），换设备不用再填一遍
            - **手机端恢复 Tailscale 直连同步**：手机上没有 `tailscale` 命令，改为自动探测本机 Tailscale 地址（100.x），在「多端」里手动填写对方地址即可同步，两端仍用同一密钥鉴权
            - Android 端启动直接进入四象限看板（修复上一版停在悬浮球界面的问题），应用图标为新的四象限渐变图标

            ## 功能一览

            - **Android 端**：arm64 APK（Android 7.0+），看板、统计、AI 对话式新建都可用；触屏上下滑动滚动列表，按住卡片约 0.26 秒后再拖动即可移动 / 排序
            - **同步**：WebDAV 合并同步（手机 ↔ 电脑）与 Tailscale 直连（桌面自动发现设备、手机手动填地址），任务按修改时间合并
            - **AI**：对话式创建任务，自动判断重要性与紧急性，并按你的修正持续校准
            - **桌面端**：四象限拖拽看板、统计面板、深浅主题、JSON 导入导出、悬浮球模式

            ## 安装

            | 平台 | 文件 |
            |------|------|
            | Windows | NSIS 安装版 `.exe` 或便携版 `.exe`（免安装） |
            | macOS | `.dmg`（Intel / Apple Silicon） |
            | Linux | `.deb` 或 `.AppImage` |
            | Android | `Eisenhower-Matrix_*_android-arm64-release.apk`（正式签名） |

            手机安装：下载 APK 后需要允许「未知来源」安装。Android 包已使用上传密钥正式签名，同时产出可上传 Google Play 的 AAB。

            ## 首次使用

            1. 安装后打开应用
            2. 点击右上角 ⚙ 设置，配置 TypeSafe AI API Key（可选）
            3. 点击任意象限的空白处新建任务
            4. 手机与电脑之间：用「设置 → WebDAV 同步」，或两端都开 Tailscale 后在「多端」里直连同步

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows portable .exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp src-tauri/target/release/eisenhower-matrix.exe "Eisenhower Matrix_${GITHUB_REF_NAME}_x64_portable.exe"
          gh release upload "$GITHUB_REF_NAME" "Eisenhower Matrix_${GITHUB_REF_NAME}_x64_portable.exe" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
