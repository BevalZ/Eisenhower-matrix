name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust_target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            rust_target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Eisenhower Matrix ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## 新功能

            - **悬浮球模式**：主窗口可一键收缩为桌面悬浮球，点击恢复
            - **AI 学习进化**：记录用户对 AI 象限判断的修正，自动校准评分偏差
            - **对话式任务创建**：多轮询问自动判断重要性与紧急性
            - **四象限看板**：拖拽移动任务，自动排序优先级
            - **统计面板**：完成率、各象限分布、近7日趋势
            - **主题切换**：浅色/深色双主题
            - **数据导入导出**：JSON 备份与恢复
            - **WebDAV 同步**：跨设备数据同步

            ## 安装

            下载对应平台的安装包：

            - **Windows**: NSIS 安装版 `.exe` 或便携版 `.exe`（免安装）
            - **macOS**: `.dmg` (Intel / Apple Silicon)
            - **Linux**: `.deb` 或 `.AppImage`

            ## 首次使用

            1. 安装后打开应用
            2. 点击右上角 ⚙ 设置，配置 TypeSafe AI API Key（可选）
            3. 点击「+ 新建任务」开始使用

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
