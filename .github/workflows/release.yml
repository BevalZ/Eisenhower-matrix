name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust_target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            rust_target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Eisenhower Matrix ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **修复：安卓端打开后停在悬浮球界面**。手机上没有「悬浮球」这种窗口形态，之前多创建的第二个窗口会挡在看板前面；现在手机端不再创建它，启动直接进入四象限看板
            - **全新应用图标**：四平台统一换成新的四象限渐变图标；Android 用自适应图标（前景 + 背景分层 + anydpi-v26），macOS / iOS 用全出血版本，Windows 用小圆角方形版本
            - 桌面端窗口、悬浮球模式、快捷键等行为保持不变

            ## 功能一览

            - **Android 端**：arm64 APK（Android 7.0+），看板、统计、AI 对话式新建、WebDAV 同步都可用；触屏上下滑动滚动列表，按住卡片约 0.26 秒后再拖动即可移动 / 排序
            - **同步**：WebDAV 合并同步（手机 ↔ 电脑）；Tailscale 直连仅桌面端可用
            - **AI**：对话式创建任务，自动判断重要性与紧急性，并按你的修正持续校准
            - **桌面端**：四象限拖拽看板、统计面板、深浅主题、JSON 导入导出、悬浮球模式

            ## 安装

            | 平台 | 文件 |
            |------|------|
            | Windows | NSIS 安装版 `.exe` 或便携版 `.exe`（免安装） |
            | macOS | `.dmg`（Intel / Apple Silicon） |
            | Linux | `.deb` 或 `.AppImage` |
            | Android | `Eisenhower-Matrix_*_android-arm64-release.apk`（正式签名） |

            手机安装：下载 APK 后需要允许「未知来源」安装。Android 包已使用上传密钥正式签名，同时产出可上传 Google Play 的 AAB。

            ## 首次使用

            1. 安装后打开应用
            2. 点击右上角 ⚙ 设置，配置 TypeSafe AI API Key（可选）
            3. 点击「+ 新建任务」开始使用
            4. 手机与电脑之间请用「设置 → WebDAV 同步」：Android 上没有 `tailscale` 命令，多端直连只在桌面端可用

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows portable .exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp src-tauri/target/release/eisenhower-matrix.exe "Eisenhower Matrix_${GITHUB_REF_NAME}_x64_portable.exe"
          gh release upload "$GITHUB_REF_NAME" "Eisenhower Matrix_${GITHUB_REF_NAME}_x64_portable.exe" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
