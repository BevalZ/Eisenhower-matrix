name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust_target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            rust_target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Eisenhower Matrix ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## 新功能

            - **Android 端**：新增手机版 APK（arm64，Android 7.0+），看板、统计、AI 对话式新建、WebDAV 同步都可用；触屏下上下滑动滚动列表，按住卡片约 0.26 秒后再拖动即可移动 / 排序
            - **同步容量修复**：任务超过 5000 条会永久失联的问题已修复（分块合并，上限提到 20 万条）；对端请求体上限 2MB → 16MB，超限时给出可操作提示
            - **密钥更安全**：同步密钥不再随状态接口下发，改为需要时按需读取；系统凭据库不可用时，设置页会明确提示「明文保存」
            - **性能优化**：统计查询由约 17 条 SQL 压到 3 条并补索引；同步按时去重从 O(n²) 改为哈希索引；AI 与 WebDAV 复用同一 HTTP 客户端（不再每次重建连接池与 TLS 会话）
            - **启动更稳**：数据库迁移会先修复重复 uid 再建唯一索引（避免启动闪退）；导出备份的模态对话框与写盘不再占用异步线程
            - **触屏与窄屏**：手机端隐藏悬浮球与 Tailscale 直连入口（改用 WebDAV），2×2 看板紧凑化、对话框占满宽度、加入安全区内边距
            - 桌面端原有能力保持不变：悬浮球模式、AI 学习进化、对话式任务创建、四象限拖拽看板、统计面板、深浅主题、JSON 导入导出、WebDAV 同步

            ## 安装

            | 平台 | 文件 |
            |------|------|
            | Windows | NSIS 安装版 `.exe` 或便携版 `.exe`（免安装） |
            | macOS | `.dmg`（Intel / Apple Silicon） |
            | Linux | `.deb` 或 `.AppImage` |
            | Android | `Eisenhower-Matrix_*_android-arm64-debug.apk` |

            手机安装：下载 APK 后需要允许「未知来源」安装。当前 Android 包使用**调试签名**（可直接安装测试）；配置签名密钥后，同一条工作流会产出正式签名的 APK 与 AAB。

            ## 首次使用

            1. 安装后打开应用
            2. 点击右上角 ⚙ 设置，配置 TypeSafe AI API Key（可选）
            3. 点击「+ 新建任务」开始使用
            4. 手机与电脑之间请用「设置 → WebDAV 同步」：Android 上没有 `tailscale` 命令，多端直连只在桌面端可用

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows portable .exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp src-tauri/target/release/eisenhower-matrix.exe "Eisenhower Matrix_${GITHUB_REF_NAME}_x64_portable.exe"
          gh release upload "$GITHUB_REF_NAME" "Eisenhower Matrix_${GITHUB_REF_NAME}_x64_portable.exe" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
