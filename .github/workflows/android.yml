# Android builds. No local dev environment is needed: this workflow installs the Android
# SDK/NDK and the Rust toolchains, generates the Android project (`gen/android` is not
# committed — `tauri android init` creates it) and uploads the APK/AAB as workflow artifacts.
#
# Signing: with the ANDROID_KEY_* secrets set, every run produces a signed release APK + AAB.
# Without them the workflow still produces an installable debug APK, so a build is never
# blocked on the keystore.
#
# Only arm64 (`aarch64`) is built: it covers every phone from ~2016 on and keeps the remote
# build short. Add armv7 by extending the `--target` value below (and the rust targets step).
name: Android

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Force a debug build even when the signing secrets are set"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NDK_VERSION: 27.0.12077973
      ABI_TARGET: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;$NDK_VERSION"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION" || { echo "::error::NDK $NDK_VERSION 安装失败"; exit 1; }
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - name: Install frontend dependencies
        run: npm install

      - name: Show the toolchain (helps when a remote build fails)
        run: |
          node --version
          java -version
          cargo --version
          rustc --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION" | head -5

      - name: Generate the Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Decide the build flavour
        id: flavour
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ] && [ "${{ inputs.release }}" != "true" ]; then
            echo "release=1" >> "$GITHUB_OUTPUT"
            echo "→ 签名 release APK + AAB"
          else
            echo "release=0" >> "$GITHUB_OUTPUT"
            echo "→ 调试 APK（未配置 ANDROID_KEY_BASE64 时使用，可直接安装测试）"
          fi

      - name: Build debug APK
        if: steps.flavour.outputs.release == '0'
        run: npx tauri android build --debug --apk --target "$ABI_TARGET"

      - name: Build release APK + AAB
        if: steps.flavour.outputs.release == '1'
        run: npx tauri android build --apk --aab --target "$ABI_TARGET"

      - name: Sign APK and AAB
        if: steps.flavour.outputs.release == '1'
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$KEYSTORE"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "using $BUILD_TOOLS"
          sign_args=(--ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS"
                     --ks-pass "pass:$ANDROID_STORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD")
          while IFS= read -r apk; do
            out="${apk%-unsigned.apk}.apk"
            [ "$out" = "$apk" ] && out="${apk%.apk}-signed.apk"
            "$BUILD_TOOLS/apksigner" sign "${sign_args[@]}" --out "$out" "$apk"
            [ "$out" != "$apk" ] && rm -f "$apk" || true
            echo "signed: $out"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" ! -name "*-signed.apk")
          while IFS= read -r aab; do
            jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" "$aab" "$ANDROID_KEY_ALIAS"
            echo "signed: $aab"
          done < <(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" 2>/dev/null || true)
          rm -f "$KEYSTORE"

      - name: Collect the installable files
        run: |
          set -euo pipefail
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs -name "*.apk" -exec cp -v {} out/ \;
          find src-tauri/gen/android/app/build/outputs -name "*.aab" -exec cp -v {} out/ \; || true
          ls -lh out
          test -n "$(ls -A out)" || { echo "::error::没有找到 APK/AAB 产物"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Android 构建产物" \
            || true
          gh release upload "$GITHUB_REF_NAME" out/* --clobber \
            || echo "::warning::上传到 Release 失败，请从本次运行的 Artifacts 下载安装包"
